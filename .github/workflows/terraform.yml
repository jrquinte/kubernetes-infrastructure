name: 'Terraform EKS Infrastructure'

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform Action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
  push:
    branches:
      - main
    paths:
      - '*.tf'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - '*.tf'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0
  TF_LOG: INFO  # Add debugging logging

jobs:
  terraform:
    name: 'Terraform ${{ github.event.inputs.action || ''plan'' }}'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true  # Keep outputs wrapper

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: |
          echo "Initializing Terraform..."
          terraform init -input=false
          echo "✅ Terraform initialized successfully"

      - name: Terraform Validate
        id: validate
        run: |
          echo "Validating Terraform configuration..."
          terraform validate -no-color
          echo "✅ Terraform configuration is valid"

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request' || github.event.inputs.action == 'plan' || github.event.inputs.action == ''
        run: |
          echo "Creating Terraform plan..."
          terraform plan -no-color -input=false -out=tfplan
          echo "✅ Terraform plan created"
        continue-on-error: false

      - name: Save Plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

      - name: Update Pull Request
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖\`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            
            <details><summary>Show Plan</summary>
            
            \`\`\`terraform\n
            ${process.env.PLAN}
            \`\`\`
            
            </details>
            
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: |
          echo "❌ Terraform plan failed"
          exit 1

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        id: apply
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve -input=false
          echo "✅ Terraform apply completed successfully"

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: |
          echo "🗑️ Destroying Terraform infrastructure..."
          terraform destroy -auto-approve -input=false
          echo "✅ Infrastructure destroyed"

      - name: Save Terraform Outputs
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        id: outputs
        run: |
          echo "📊 Collecting Terraform outputs..."
          echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT
          echo "cluster_endpoint=$(terraform output -raw cluster_endpoint)" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "configure_kubectl=$(terraform output -raw configure_kubectl)" >> $GITHUB_OUTPUT
          echo "vpc_id=$(terraform output -raw vpc_id)" >> $GITHUB_OUTPUT
          echo "✅ Outputs collected"

      - name: Verify AWS Load Balancer Controller
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        run: |
          echo "🔍 Verifying AWS Load Balancer Controller installation..."
          
          # Configure kubectl
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name $(terraform output -raw cluster_name)
          
          # Wait for controller to be ready
          echo "Waiting for AWS Load Balancer Controller pods..."
          kubectl wait --for=condition=ready pod \
            -l app.kubernetes.io/name=aws-load-balancer-controller \
            -n kube-system \
            --timeout=300s || echo "⚠️ Controller not ready yet, may take a few more minutes"
          
          # Check controller status
          echo ""
          echo "=== AWS Load Balancer Controller Status ==="
          kubectl get deployment aws-load-balancer-controller -n kube-system || echo "Controller deployment not found yet"
          echo ""
          kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller || echo "Controller pods not found yet"

      - name: Verify Security Group Configuration
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        run: |
          echo "🔒 Verifying Security Group configuration..."
          
          CLUSTER_NAME=$(terraform output -raw cluster_name)
          echo "Cluster: $CLUSTER_NAME"
          
          # Get all security groups with cluster tag
          echo ""
          echo "=== Security Groups with cluster tag ==="
          aws ec2 describe-security-groups \
            --filters "Name=tag:kubernetes.io/cluster/$CLUSTER_NAME,Values=owned,shared" \
            --query 'SecurityGroups[*].[GroupId,GroupName,Tags[?Key==`Name`].Value|[0]]' \
            --output table
          
          # Verify node security group has correct rules
          NODE_SG=$(terraform output -raw cluster_security_group_id 2>/dev/null || echo "")
          if [ ! -z "$NODE_SG" ]; then
            echo ""
            echo "=== Node Security Group Rules ==="
            aws ec2 describe-security-groups \
              --group-ids $NODE_SG \
              --query 'SecurityGroups[0].IpPermissions[?ToPort>=`30000` && ToPort<=`32767`]' \
              --output table || echo "NodePort rules will be added by Load Balancer Controller"
          fi
          
          echo ""
          echo "✅ Security Group verification complete"

      - name: Display Infrastructure Summary
        if: github.event.inputs.action == 'apply' && github.ref == 'refs/heads/main'
        run: |
          echo ""
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║          Infrastructure Deployed Successfully! 🎉              ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📋 Infrastructure Details:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "🎯 EKS Cluster"
          echo "  Name:     $(terraform output -raw cluster_name)"
          echo "  Endpoint: $(terraform output -raw cluster_endpoint)"
          echo "  Region:   ${{ env.AWS_REGION }}"
          echo ""
          echo "🐳 ECR Repository"
          echo "  URL: $(terraform output -raw ecr_repository_url)"
          echo ""
          echo "🌐 VPC"
          echo "  ID: $(terraform output -raw vpc_id)"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📝 Next Steps:"
          echo ""
          echo "1️⃣  Configure kubectl:"
          echo "   $(terraform output -raw configure_kubectl)"
          echo ""
          echo "2️⃣  Verify cluster:"
          echo "   kubectl get nodes"
          echo "   kubectl get pods -A"
          echo ""
          echo "3️⃣  Deploy your application:"
          echo "   - Push your Docker image to ECR"
          echo "   - Use the deploy.yml workflow to deploy to Kubernetes"
          echo ""
          echo "4️⃣  Verify AWS Load Balancer Controller:"
          echo "   kubectl get pods -n kube-system -l app.kubernetes.io/name=aws-load-balancer-controller"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Create Deployment Summary
        if: always() && (github.event.inputs.action == 'apply' || github.event.inputs.action == 'destroy')
        run: |
          echo "## Terraform Deployment Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            echo "### ✅ Infrastructure Applied" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Cluster Name** | \`$(terraform output -raw cluster_name 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **ECR Repository** | \`$(terraform output -raw ecr_repository_url 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **VPC ID** | \`$(terraform output -raw vpc_id 2>/dev/null || echo 'N/A')\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Region** | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Configure kubectl: \`$(terraform output -raw configure_kubectl 2>/dev/null || echo 'Check outputs')\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Deploy your application using the deployment workflow" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event.inputs.action }}" == "destroy" ]; then
            echo "### 🗑️ Infrastructure Destroyed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "All resources have been successfully destroyed." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Workflow run: ${{ github.run_number }}*" >> $GITHUB_STEP_SUMMARY

      - name: Handle Errors
        if: failure()
        run: |
          echo "❌ Workflow failed!"
          echo ""
          echo "Common issues:"
          echo "1. Check AWS credentials are valid"
          echo "2. Verify Terraform state is not locked"
          echo "3. Check AWS service quotas (especially for EKS, VPC)"
          echo "4. Review Terraform logs above for specific errors"
          echo ""
          echo "Need help? Check:"
          echo "- GitHub Actions logs above"
          echo "- AWS CloudWatch logs"
          echo "- Terraform state in S3 (if using remote backend)"